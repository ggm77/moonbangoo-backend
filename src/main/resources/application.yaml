spring:
  application:
    name: moonbangoo
  datasource:
    url: jdbc:sqlite:./moonbangoo.db?foreign_keys=on&busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  servlet:
    session:
      # 어드민 로그인 유지 시간, 로그인 쿠키는 같은 주소에서 보낸 요청에만 붙음
      timeout: 12h
      cookie:
        same-site: strict

# 어드민 페이지 비밀번호 (평문, 반드시 바꿔서 사용)
admin:
  password: moonbangoo1234

# 업로드한 이미지를 저장하는 폴더 (서버를 실행한 폴더 기준)
upload:
  dir: ./uploads


cors:
  allowed-origins: http://localhost:5173,https://jeondowon.github.io

# Swagger는 꺼 둠, 필요하면 enabled를 true로 바꿈
springdoc:
  api-docs:
    enabled: false
    path: /api/v3/api-docs
  swagger-ui:
    enabled: false
    path: /api/swagger
